<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chariots Prysmian">
<title>Chariots Prysmian</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" href="img/icon-192.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#eaf0fa;font:17px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;touch-action:manipulation}
  #gate{width:min(92vw,380px);background:#151f38;border-radius:22px;padding:28px 22px;box-shadow:0 8px 28px rgba(0,0,0,.45);text-align:center;border-top:4px solid #00b4b8}
  #gate h1{font-size:22px;margin:0 0 6px}
  #gate p{color:#9aa7c0;margin:0 0 18px;font-size:15px}
  #pin{width:100%;box-sizing:border-box;height:72px;border-radius:16px;border:2px solid #27345a;background:#0b1220;color:#eaf0fa;text-align:center;font-size:34px;letter-spacing:.5em;padding-left:.5em;font-weight:700;outline:none}
  #pin:focus{border-color:#00b4b8;box-shadow:0 0 0 4px #00b4b833}
  #err{color:#ff6b6b;font-weight:650;min-height:24px;margin-top:12px;font-size:15px}
  html[data-theme=light] body{background:#f3f6f9;color:#283048}
  html[data-theme=light] #gate{background:#fff;box-shadow:0 6px 24px rgba(40,48,72,.12)}
  html[data-theme=light] #gate p{color:#5d6679}
  html[data-theme=light] #pin{background:#fff;color:#283048;border-color:#dbe1ea}
</style>
</head>
<body>
<div id="gate"><h1>Chariots Prysmian</h1><p id="msg">Chargement…</p><div id="form" hidden><input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••"><div id="err"></div></div></div>
<script>
try { if (localStorage.getItem('cc.theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
(function () {
  var $ = function (s) { return document.querySelector(s); };
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // le secret arrive par le lien du QR code (#k=…). On le garde sur ce téléphone ET dans l'adresse :
  // « Ajouter à l'écran d'accueil » mémorise l'adresse complète, donc le raccourci contient le secret
  // (sur iPhone, un raccourci a son propre stockage, séparé de Safari).
  var parts = location.hash.slice(1).split('&').filter(Boolean);
  var kp = parts.filter(function (p) { return p.indexOf('k=') === 0; })[0];
  if (kp) {
    if (get('vc.k') !== kp.slice(2)) { set('vc.k', kp.slice(2)); del('vc.pin'); }   // nouveau secret : on redemande le code
  }
  var standalone = (window.navigator && window.navigator.standalone) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

  var STORE = 'https://kqplliavpijhqudkahix.supabase.co/storage/v1/object/public/app/app.enc';   // version remise à jour par l'admin (changement de code)

  function parse(buf) {                       // VC1 : 35 octets d'en-tête ; VC2 : 43 octets + horodatage
    var dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    if (buf[0] !== 0x56 || buf[1] !== 0x43) return null;
    if (buf[2] === 0x32) return { ts: dv.getFloat64(7), iter: dv.getUint32(3), salt: buf.slice(15, 31), iv: buf.slice(31, 43), data: buf.slice(43) };
    return { ts: 0, iter: dv.getUint32(3), salt: buf.slice(7, 23), iv: buf.slice(23, 35), data: buf.slice(35) };
  }
  async function grab(url, opts) {
    try { var r = await fetch(url, opts); if (!r.ok) return null; return parse(new Uint8Array(await r.arrayBuffer())); } catch (e) { return null; }
  }
  async function newest() {                   // la plus récente des deux sources
    var got = await Promise.all([grab('app.enc', { cache: 'no-cache' }), grab(STORE + '?t=' + Date.now(), { cache: 'no-store' })]);
    var best = null; got.forEach(function (g) { if (g && (!best || g.ts > best.ts)) best = g; });
    if (!best) throw new Error('fichier');
    return best;
  }
  async function decrypt(secret, pin) {
    var f = await newest();
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret + ':' + pin), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: f.salt, iterations: f.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: f.iv }, key, f.data);   // lève une erreur si le code est faux
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function start(p) {
    window.__CC_PAYLOAD = p;                  // gardée en mémoire seulement : l'admin s'en sert pour changer le code
    var st = document.createElement('style'); st.textContent = p.css; document.head.appendChild(st);
    document.body.removeAttribute('style'); document.body.innerHTML = p.html;
    p.scripts.forEach(function (code) { var s = document.createElement('script'); s.text = code; document.head.appendChild(s); });
  }

  async function tryOpen(pin) {
    var secret = get('vc.k');
    try { var p = await decrypt(secret, pin); set('vc.pin', pin); start(p); return true; }
    catch (e) { return e && e.message === 'fichier' ? 'offline' : false; }
  }

  async function boot() {
    if (!window.crypto || !crypto.subtle) { $('#msg').textContent = 'Ouvrez cette page en https.'; return; }
    if (!get('vc.k')) { $('#msg').textContent = standalone ? 'Ce raccourci n’a pas le lien d’accès. Supprimez-le, rouvrez le QR code dans Safari, puis « Sur l’écran d’accueil » de nouveau.' : 'Scannez le QR code affiché sur le site pour ouvrir l’application.'; return; }
    var pin = get('vc.pin');
    if (pin) { var r = await tryOpen(pin); if (r === true) return; if (r === 'offline') { $('#msg').textContent = 'Connexion nécessaire pour la première ouverture.'; return; } del('vc.pin'); }
    $('#msg').textContent = 'Entrez votre code à 4 chiffres'; $('#form').hidden = false;
    var inp = $('#pin'); inp.focus();
    inp.addEventListener('input', async function () {
      inp.value = inp.value.replace(/\D/g, '');
      if (inp.value.length < 4) { $('#err').textContent = ''; return; }
      inp.disabled = true; $('#err').textContent = 'Vérification…';
      var r = await tryOpen(inp.value);
      if (r === true) return;
      inp.disabled = false; inp.value = ''; inp.focus();
      $('#err').textContent = r === 'offline' ? 'Connexion nécessaire.' : 'Code incorrect. Si le code a changé, rouvrez le nouveau QR code.';
    });
  }
  boot();
})();
</script>
</body>
</html>
